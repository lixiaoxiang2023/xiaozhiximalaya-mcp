name: keepalive

on:
  schedule:
    # Render 免费层 15 分钟无入站即休眠；每 10 分钟敲一次 /health
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.HEALTH_URL }}"
          if [ -z "$URL" ]; then
            echo "未设置仓库变量 HEALTH_URL，跳过"
            exit 0
          fi
          echo "GET $URL"
          curl -fsS --max-time 20 "$URL" && echo " -> HTTP 200 OK"
